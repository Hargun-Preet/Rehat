[project]
name = "rehat"
version = "0.1.0"
description = "Rehat weather downtime cover engine (concept prototype)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pytest>=8.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rehat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
